// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath 'com.google.gms:google-services:4.4.4'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// SDK 57 inline Kotlin modules compile in :expo, not :app. Give the
// read-only Play checkout probe the same Billing version RevenueCat uses.
subprojects { subproject ->
  if (subproject.name == "expo") {
    subproject.plugins.withId("com.android.library") {
      subproject.dependencies.add("implementation", "com.android.billingclient:billing:8.3.0")
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
