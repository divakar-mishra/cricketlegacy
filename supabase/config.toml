[auth]
site_url = "https://sunlight-publisher-site.pages.dev"
additional_redirect_urls = ["coverdrive://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.delete-account]
verify_jwt = true

[functions.premium-sponsor-create-intent]
verify_jwt = true

[functions.premium-sponsor-reconcile]
verify_jwt = true

[functions.revenuecat-sponsor-webhook]
verify_jwt = false
