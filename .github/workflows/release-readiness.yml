name: Release readiness

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  legal-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run check:release
